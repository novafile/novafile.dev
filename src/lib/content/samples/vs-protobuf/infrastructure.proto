syntax = "proto3";

package infrastructure.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

message Service {
  string id = 1;
  uint32 port = 3;
  uint32 replicas = 4;
  Status status = 5;
  google.protobuf.Timestamp deployed_at = 6;
}

message Status {
  oneof variant {
    google.protobuf.Empty active = 1;
    google.protobuf.Empty draining = 2;
    string failed = 3;
  }
}
